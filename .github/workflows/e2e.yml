name: E2E tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tests
        uses: actions/checkout@v4

      - name: Check out Spring PetClinic
        uses: actions/checkout@v4
        with:
          repository: spring-projects/spring-petclinic
          path: petclinic

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start PetClinic
        run: |
          cd petclinic
          nohup ./mvnw -q spring-boot:run > ../app.log 2>&1 &

      - name: Wait for app
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080 > /dev/null; then echo "App is up"; exit 0; fi
            sleep 2
          done
          echo "App did not start"; tail -50 app.log; exit 1

      - name: Install Playwright browser
        run: mvn -q exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Run tests
        run: mvn test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            traces/
            target/surefire-reports/
            app.log
